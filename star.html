<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Become a Star — Stardom</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:#07040f;font-family:'Plus Jakarta Sans',sans-serif;color:rgba(250,247,242,.88);}
canvas#star-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.page{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.5rem 1.25rem;
}
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:.48rem;letter-spacing:4px;text-transform:uppercase;
  color:rgba(201,168,76,.45);margin-bottom:.7rem;text-align:center;
}
.heading{
  font-family:'Cormorant',Georgia,serif;
  font-size:clamp(2.2rem,6vw,3.2rem);font-weight:400;font-style:italic;
  color:rgba(250,247,242,.9);line-height:1.05;text-align:center;
  margin-bottom:.5rem;
}
.subheading{
  font-size:.78rem;color:rgba(250,247,242,.3);text-align:center;
  line-height:1.8;margin-bottom:2.25rem;max-width:330px;
}
.form-card{
  width:100%;max-width:420px;
  background:rgba(201,168,76,.03);
  border:0.5px solid rgba(201,168,76,.16);
  border-radius:16px;padding:2rem 1.85rem;
  backdrop-filter:blur(20px);
}
.fg{margin-bottom:1rem;}
.fg label{
  display:flex;align-items:center;gap:.4rem;
  font-family:'DM Mono',monospace;
  font-size:.46rem;letter-spacing:2px;text-transform:uppercase;
  color:rgba(201,168,76,.5);margin-bottom:.45rem;
}
.opt{font-size:.42rem;color:rgba(250,247,242,.18);letter-spacing:1px;}
.fi{
  width:100%;padding:.65rem .85rem;
  background:rgba(255,255,255,.03);
  border:0.5px solid rgba(201,168,76,.1);
  border-radius:8px;outline:none;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.82rem;color:rgba(250,247,242,.88);
  transition:border-color .2s,background .2s;
}
.fi::placeholder{color:rgba(250,247,242,.18);}
.fi:focus{border-color:rgba(201,168,76,.32);background:rgba(255,255,255,.05);}
.fi.err{border-color:rgba(220,90,90,.4);}
.error-msg{
  display:none;font-size:.71rem;
  color:rgba(220,100,100,.8);text-align:center;
  margin-bottom:.85rem;line-height:1.55;
}
.btn-join{
  width:100%;padding:.82rem;
  background:rgba(201,168,76,.1);
  border:0.5px solid rgba(201,168,76,.28);
  border-radius:10px;cursor:pointer;
  font-family:'Cormorant',Georgia,serif;
  font-size:1.1rem;font-style:italic;font-weight:400;
  color:rgba(201,168,76,.85);letter-spacing:.01em;
  transition:all .22s;
}
.btn-join:hover{background:rgba(201,168,76,.18);border-color:rgba(201,168,76,.48);color:#c9a84c;}
.btn-join:disabled{opacity:.4;cursor:default;}
.signin-link{
  margin-top:1.5rem;text-align:center;
  font-family:'DM Mono',monospace;font-size:.48rem;
  letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(250,247,242,.18);
}
.signin-link a{color:rgba(201,168,76,.4);text-decoration:none;transition:color .2s;}
.signin-link a:hover{color:rgba(201,168,76,.75);}
.success-overlay{
  display:none;position:fixed;inset:0;
  background:#07040f;z-index:100;
  flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  animation:fadeIn .4s ease;
}
.success-overlay.on{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.s-star{
  font-size:3rem;margin-bottom:.25rem;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.s-title{
  font-family:'Cormorant',Georgia,serif;
  font-size:2rem;font-style:italic;
  color:rgba(250,247,242,.8);
}
.s-sub{
  font-family:'DM Mono',monospace;font-size:.48rem;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(201,168,76,.45);margin-top:.2rem;
}
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div class="page">
  <div class="eyebrow">Stardom &middot; Miss California USA 2026</div>
  <div class="heading">Enter the <em>Starfield</em></div>
  <div class="subheading">Claim your place — follow the journey from the inside, see what&rsquo;s being built, and become part of the story.</div>

  <div class="form-card">
    <div class="fg">
      <label>Your Name</label>
      <input class="fi" id="sf-name" type="text" placeholder="Full name" autocomplete="name">
    </div>
    <div class="fg">
      <label>Email</label>
      <input class="fi" id="sf-email" type="email" placeholder="name@example.com" autocomplete="email">
    </div>
    <div class="fg">
      <label>Instagram <span class="opt">optional</span></label>
      <input class="fi" id="sf-insta" type="text" placeholder="@handle">
    </div>
    <div class="fg">
      <label>Password</label>
      <input class="fi" id="sf-pass" type="password" placeholder="6 or more characters" autocomplete="new-password">
    </div>
    <div class="fg" style="margin-bottom:1.4rem">
      <label>Confirm Password</label>
      <input class="fi" id="sf-pass2" type="password" placeholder="Repeat your password" autocomplete="new-password" onkeydown="if(event.key==='Enter')joinStarfield()">
    </div>
    <div class="error-msg" id="sf-error"></div>
    <button class="btn-join" id="sf-btn" onclick="joinStarfield()">✦ Enter the Starfield</button>
  </div>

  <div class="signin-link">
    Already a star? <a href="index.html">Sign in</a>
  </div>
</div>

<div class="success-overlay" id="success-overlay">
  <div class="s-star">✦</div>
  <div class="s-title">Welcome to the Starfield</div>
  <div class="s-sub">Entering the space&hellip;</div>
</div>

<script>
// Star field canvas animation
(function(){
  var c = document.getElementById('star-canvas');
  var ctx = c.getContext('2d');
  var stars = [];
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  for(var i = 0; i < 160; i++){
    stars.push({
      x: Math.random(), y: Math.random(),
      r: .3 + Math.random() * 1.3,
      o: .06 + Math.random() * .38,
      speed: .6 + Math.random() * 1.4,
      phase: Math.random() * Math.PI * 2
    });
  }
  function draw(t){
    ctx.clearRect(0, 0, c.width, c.height);
    // Subtle nebula glow center
    var g = ctx.createRadialGradient(c.width*.5, c.height*.42, 0, c.width*.5, c.height*.42, c.width*.65);
    g.addColorStop(0, 'rgba(80,30,130,.1)');
    g.addColorStop(1, 'rgba(7,4,15,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
    for(var i = 0; i < stars.length; i++){
      var s = stars[i];
      var op = s.o * (.55 + .45 * Math.sin(t * .001 * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x * c.width, s.y * c.height, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(248,243,218,' + op + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

function showErr(msg){
  var el = document.getElementById('sf-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function joinStarfield(){
  var name  = (document.getElementById('sf-name').value  || '').trim();
  var email = (document.getElementById('sf-email').value || '').trim().toLowerCase();
  var insta = (document.getElementById('sf-insta').value || '').trim().replace(/^@/, '');
  var pass  = (document.getElementById('sf-pass').value  || '').trim();
  var pass2 = (document.getElementById('sf-pass2').value || '').trim();

  document.getElementById('sf-error').style.display = 'none';
  ['sf-name','sf-email','sf-pass','sf-pass2'].forEach(function(id){ document.getElementById(id).classList.remove('err'); });

  if(!name || !email || !pass){
    showErr('Name, email, and password are required.');
    if(!name) document.getElementById('sf-name').classList.add('err');
    if(!email) document.getElementById('sf-email').classList.add('err');
    if(!pass) document.getElementById('sf-pass').classList.add('err');
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showErr('Enter a valid email address.');
    document.getElementById('sf-email').classList.add('err');
    return;
  }
  if(pass.length < 6){
    showErr('Password must be at least 6 characters.');
    document.getElementById('sf-pass').classList.add('err');
    return;
  }
  if(pass !== pass2){
    showErr('Passwords don’t match.');
    document.getElementById('sf-pass2').classList.add('err');
    return;
  }

  var profiles;
  try { profiles = JSON.parse(localStorage.getItem('chq-portal-profiles') || '{}'); } catch(e){ profiles = {}; }
  if(!profiles.star) profiles.star = [];

  if(profiles.star.some(function(p){ return String(p.email||'').toLowerCase() === email; })){
    showErr('That email already has a Star account. Sign in on the main page.');
    document.getElementById('sf-email').classList.add('err');
    return;
  }

  // Auto-generate username from name, deduplicate
  var base = name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,16) || ('star' + Date.now().toString().slice(-4));
  var username = base, n = 1;
  while(profiles.star.some(function(p){ return p.username === username; })){ username = base + (n++); }

  var id = username + '-' + Date.now();
  profiles.star.unshift({
    id: id, name: name, email: email,
    username: username, password: pass,
    instagram: insta, bio: '',
    status: 'active', active: true,
    notes: 'Joined via Become a Star page', goals: []
  });

  localStorage.setItem('chq-portal-profiles', JSON.stringify(profiles));
  localStorage.setItem('chq-star-autologin', JSON.stringify({ role: 'star', id: id }));

  var btn = document.getElementById('sf-btn');
  btn.disabled = true;
  btn.textContent = '✦ Entering…';

  document.getElementById('success-overlay').classList.add('on');
  setTimeout(function(){ window.location.href = 'index.html'; }, 1300);
}
</script>
</body>
</html>
